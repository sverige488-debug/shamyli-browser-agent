name: Official Computer Windows smoke

on:
  push:
    branches:
      - shamyli/official-computer
    paths:
      - '.github/workflows/official-computer-windows-smoke.yml'
      - '.cptr/**'
  workflow_dispatch:

concurrency:
  group: official-computer-windows-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact official Computer release
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cptr[all]==0.9.21"
          cptr --help | Out-Host

      - name: Start cptr natively on Windows
        shell: pwsh
        run: |
          Start-Process -FilePath "cptr" -ArgumentList @("run","--host","127.0.0.1","--port","8000","--headless") -RedirectStandardOutput "$env:RUNNER_TEMP\cptr-out.log" -RedirectStandardError "$env:RUNNER_TEMP\cptr-err.log"

      - name: Verify health exact version and frontend
        shell: pwsh
        run: |
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $health = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/health" -TimeoutSec 2
              if ($health.status -eq "ok") { $ready = $true; break }
            } catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            Get-Content "$env:RUNNER_TEMP\cptr-out.log" -ErrorAction SilentlyContinue
            Get-Content "$env:RUNNER_TEMP\cptr-err.log" -ErrorAction SilentlyContinue
            throw "cptr did not become healthy on Windows"
          }

          $config = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/config"
          if ($config.version -ne "0.9.21") { throw "Unexpected cptr version: $($config.version)" }

          $index = Invoke-WebRequest -Uri "http://127.0.0.1:8000/" -UseBasicParsing
          if ($index.StatusCode -ne 200 -or [string]::IsNullOrWhiteSpace($index.Content)) { throw "Frontend did not load" }

          Write-Host "health: PASS"
          Write-Host "version: $($config.version)"
          Write-Host "frontend: PASS"

      - name: Verify Windows browser discovery
        shell: pwsh
        run: |
          python -c "from cptr.utils.browser.launcher import find_browser; b=find_browser(); print(b or ''); assert b, 'No Chrome-family browser discovered on Windows runner'"

      - name: Verify native approval metadata
        shell: pwsh
        run: |
          python -c "from cptr.utils.tools import BROWSER_TOOLS; assert BROWSER_TOOLS['browser_snapshot'].get('approval') == 'allow'; assert BROWSER_TOOLS['browser_screenshot'].get('approval') == 'allow'; assert 'approval' not in BROWSER_TOOLS['browser_click']; assert 'approval' not in BROWSER_TOOLS['browser_type']; print('approval metadata: PASS')"

      - name: Verify native stdio MCP runtime
        shell: pwsh
        run: |
          python -c "import mcp; from cptr.utils.mcp.stdio_manager import stdio_manager; print(type(stdio_manager).__name__)"

      - name: Verify SHAMYLI skill discovery on Windows
        shell: pwsh
        run: |
          python -c "from cptr.utils.skills import discover_skills; skills=discover_skills(r'$env:GITHUB_WORKSPACE'); names=[s.name for s in skills]; print(names); assert 'shamyli-safe-web' in names"

      - name: Show cptr logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-Content "$env:RUNNER_TEMP\cptr-out.log" -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP\cptr-err.log" -ErrorAction SilentlyContinue

      - name: Stop cptr server
        if: always()
        shell: pwsh
        run: |
          Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue | ForEach-Object {
            Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue
          }
